<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT AutoLogintor · 本地导入</title>
  <link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script>
</head>
<body>
  <header><span class="badge">无痕窗口专用</span><h1>导入 ChatGPT 会话</h1><p>适用于自己的账号或已获本人授权的访问。</p></header>
  <p id="target" class="notice" role="status">正在检查当前窗口…</p>
  <label for="token">Session Token</label>
  <div class="field"><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴完整 sessionToken"><button id="reveal" type="button" aria-pressed="false">显示</button></div>
  <p class="hint">只粘贴令牌本身；如有完整 JSON，先在本地工具中提取。输入只暂存在内存中。</p>
  <button id="import" class="primary" disabled>导入并刷新当前页</button>
  <div class="actions"><button id="clear" disabled>清除登录 Cookie</button><button id="erase">清空输入</button></div>
  <p id="result" class="notice" role="status" hidden></p>
  <p class="foot">导入前会清除当前无痕存储区的旧登录 Cookie。共享此存储区的其他 ChatGPT 无痕标签也会受到影响，普通窗口不受影响。</p>
  <p class="foot">不读取聊天、不修改 Cloudflare Cookie、不处理人机验证。Cookie 写入成功不等于登录成功。</p>
</body>
</html>
